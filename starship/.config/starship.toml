"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

format = "$directory$character"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold blue)"
vimcmd_symbol = "[❮](bold blue)"

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"

