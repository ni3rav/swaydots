# Bar follows the wallpaper palette. Compact alt-tab.

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Tokyo-Night"
wallpaper_scheme = "m3-monochrome"

[bar]
order = ["default"]

[bar.default]
auto_hide = false
auto_hide_delay_ms = 0
auto_hide_reserve_space = false
background_opacity = 1.0
border = "outline_variant"
border_width = 0.0
capsule = false
capsule_border_width = 1.0
capsule_fill = "surface_container"
capsule_opacity = 1.0
capsule_padding = 6.0
capsule_thickness = 0.76
center = [  ]
compositor_blur = false
concave_edge_corners = false
contact_shadow = false
enabled = true
end = [ "tray", "notifications", "cpu", "ram", "temp", "battery", "brightness", "media", "volume", "network", "bluetooth", "session", "clock" ]
font_family = "JetBrainsMono NF"
font_scale = 1.0
font_weight = 500
hover_highlight = true
layer = "top"
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 12
panel_overlap = 0
position = "bottom"
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = true
scale = 1.0
shadow = false
show_on_workspace_switch = true
show_tooltip = true
smart_auto_hide = false
start = [ "workspaces" ]
thickness = 28
widget_spacing = 20

[widget.workspaces]
anchor = true
type = "swaydots/bar:workspaces"

[widget.tray]
colorize_icons = true
drawer = true
match_adjacent_spacing = true
type = "tray"

[widget.cpu]
show_glyph = true
show_value = true
stat = "cpu_usage"
type = "sysmon"
visualization = "none"

[widget.ram]
show_glyph = true
show_value = true
stat = "ram_pct"
type = "sysmon"
visualization = "none"

[widget.temp]
show_glyph = true
show_value = true
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.battery]
display_mode = "none"
hide_when_full = false
hide_when_plugged = false
scale = 1.0
show_label = true
type = "battery"

[widget.brightness]
show_label = false
type = "brightness"

[widget.media]
type = "swaydots/bar:media"

[widget.volume]
device = "output"
show_label = false
type = "volume"

[widget.network]
show_label = false
type = "network"
vpn_status = "replace"

[widget.bluetooth]
show_label = false
type = "bluetooth"

[widget.clock]
anchor = false
format = "%b %d %a, %H:%M"
type = "clock"

[shell.panel]
transparency_mode = "solid"
launcher_placement = "floating"
launcher_position = "center"
open_near_click_launcher = false
clipboard_placement = "floating"
clipboard_position = "center"
open_near_click_clipboard = false
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "attached"
open_near_click_wallpaper = false
session_placement = "attached"
open_near_click_session = false

[shell.window_switcher]
style = "compact"
mru = false
show_app_icon = true
show_caption = true
show_count = true
current_workspace_only = false
show_all_outputs = true

# No HUD popup when track changes
[osd.kinds]
media = false

[lockscreen]
transition = ["fade"]
transition_duration = 200
edge_smoothness = 0

