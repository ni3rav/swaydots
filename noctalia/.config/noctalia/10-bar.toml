# Bar follows the wallpaper palette. Compact alt-tab.

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Tokyo-Night"
wallpaper_scheme = "m3-monochrome"

[bar]
order = ["default"]

[bar.default]
auto_hide = false
auto_hide_delay_ms = 0
background_opacity = 0.95
border = "outline_variant"
border_width = 0.0
capsule = false
capsule_border_width = 1.0
capsule_fill = "surface_container"
capsule_opacity = 1.0
capsule_padding = 6.0
capsule_thickness = 0.76
center = [ "clock" ]
compositor_blur = false
concave_edge_corners = false
contact_shadow = false
enabled = true
end = [ "tray", "notifications", "battery", "sysmon", "power_profile", "widget", "brightness", "volume", "network", "bluetooth", "media", "session" ]
font_family = "JetBrainsMono NF"
font_scale = 1.0
font_weight = 500
hover_highlight = true
layer = "top"
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 20
panel_overlap = 0
position = "top"
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = true
scale = 1.0
shadow = false
show_on_workspace_switch = true
show_tooltip = true
smart_auto_hide = false
start = [ "workspaces" ]
thickness = 30
widget_spacing = 20

[widget.workspaces]
active_pill_size = 1.0
anchor = true
change_color_on_hover = false
empty_color = "secondary_container"
focused_color = "primary"
font_scale = 1.0
hide_when_empty = false
label_source = "id"
labels_only_when_occupied = false
occupied_color = "secondary_container"
show_icons = false
show_labels = true
style = "regular"
type = "workspaces"
urgent_color = "error"

[widget.clock]
anchor = false
font_family = "JetBrainsMono Nerd Font"
font_scale = 1.0
font_weight = 400
format = "%b %d %H:%M"
type = "clock"

[widget.tray]
drawer = true
match_adjacent_spacing = true
type = "tray"

[widget.battery]
display_mode = "graphic"
hide_when_full = false
hide_when_plugged = false
scale = 1.0
show_label = true
type = "battery"

[widget.widget]
type = "micahg/nwg-displays:widget"

[widget.brightness]
scale = 1.2
show_label = false
type = "brightness"

[widget.volume]
device = "output"
scale = 1.2
show_label = false
type = "volume"

[widget.network]
scale = 1.2
show_label = false
type = "network"
vpn_status = "both"

[widget.bluetooth]
scale = 1.15
show_label = false
type = "bluetooth"

[widget.media]
album_art_only = true
art_size = 20
hide_when_no_media = true
max_length = 220.0
min_length = 82
title_scroll = "none"
type = "media"

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
open_near_click_launcher = false
clipboard_placement = "floating"
clipboard_position = "center"
open_near_click_clipboard = false
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "attached"
open_near_click_wallpaper = false
session_placement = "attached"
open_near_click_session = false

[shell.window_switcher]
style = "compact"
mru = false
show_app_icon = true
show_caption = true
show_count = true
current_workspace_only = false
show_all_outputs = true

# No HUD popup when track changes
[osd.kinds]
media = false

[lockscreen]
transition = ["fade"]
transition_duration = 200
edge_smoothness = 0

