[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[bar]
order = ["default"]

[bar.default]
enabled = true
position = "top"
thickness = 34
padding = 14
widget_spacing = 6
scale = 1.0
font_scale = 1.0
font_weight = 500
background_opacity = 1.0
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
margin_edge = 0
margin_ends = 100
margin_opposite_edge = 0
reserve_space = true
auto_hide = false
smart_auto_hide = false
layer = "top"
shadow = true
capsule = false
concave_edge_corners = true
hover_highlight = true
show_tooltip = true
border_width = 0
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]

[widget.workspaces]
type = "workspaces"
style = "regular"
show_labels = true
show_icons = false
label_source = "id"
hide_when_empty = false

[widget.clock]
type = "clock"
format = "{:%a %b %-d, %H:%M}"

[widget.volume]
type = "volume"
device = "output"
show_label = false

[widget.network]
type = "network"
show_label = false

[widget.bluetooth]
type = "bluetooth"
show_label = false

[widget.battery]
type = "battery"
display_mode = "glyph"
show_label = false

[widget.brightness]
type = "brightness"
show_label = false

[widget.tray]
type = "tray"
drawer = true
hide_passive = true

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
open_near_click_launcher = false
clipboard_placement = "floating"
clipboard_position = "center"
open_near_click_clipboard = false
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "attached"
open_near_click_wallpaper = false
session_placement = "attached"
open_near_click_session = false
