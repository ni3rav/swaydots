# Bar follows the wallpaper palette. Compact alt-tab.

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Tokyo-Night"
wallpaper_scheme = "m3-monochrome"

[bar]
order = ["default"]

[bar.default]
enabled = true
position = "top"
thickness = 36
padding = 20
widget_spacing = 20
scale = 1.0
font_family = "JetBrainsMono NF"
font_scale = 1.0
font_weight = 500
background_opacity = 0.85
compositor_blur = false
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
panel_overlap = 0
reserve_space = true
auto_hide = false
smart_auto_hide = false
layer = "top"
shadow = false
capsule = false
concave_edge_corners = false
hover_highlight = true
show_tooltip = true
border_width = 0
start = ["workspaces"]
center = ["clock"]
end = [
  "notifications",
  "battery",
  "brightness",
  "volume",
  "network",
  "bluetooth",
  "media",
]

[widget.workspaces]
type = "workspaces"
style = "regular"
font_scale = 1.0
show_labels = true
show_icons = false
label_source = "id"
hide_when_empty = false
labels_only_when_occupied = false
focused_color = "#c0caf5"
occupied_color = "#565f89"
empty_color = "#414868"
urgent_color = "#f7768e"
change_color_on_hover = false

[widget.clock]
type = "clock"
format = "{:%a %b %-d, %H:%M}"
anchor = true
font_family = "JetBrainsMono Nerd Font"
font_scale = 1.05
font_weight = 600

[widget.brightness]
type = "brightness"
show_label = false
scale = 1.2

[widget.volume]
type = "volume"
device = "output"
show_label = false
scale = 1.2

[widget.battery]
type = "battery"
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true
show_label = true
scale = 0.8

[widget.network]
type = "network"
show_label = false
scale = 1.2
vpn_status = "both"

[widget.bluetooth]
type = "bluetooth"
show_label = false
scale = 1.15

[widget.media]
type = "media"
album_art_only = true
art_size = 20
hide_when_no_media = true
min_length = 82

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
open_near_click_launcher = false
clipboard_placement = "floating"
clipboard_position = "center"
open_near_click_clipboard = false
control_center_placement = "attached"
open_near_click_control_center = false
wallpaper_placement = "attached"
open_near_click_wallpaper = false
session_placement = "attached"
open_near_click_session = false

[shell.window_switcher]
style = "compact"
mru = false
show_app_icon = true
show_caption = true
show_count = true
current_workspace_only = false
show_all_outputs = true

# No HUD popup when track changes
[osd.kinds]
media = false

[lockscreen]
transition = ["fade"]
transition_duration = 200
edge_smoothness = 0

