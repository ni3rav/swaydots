set $mod Mod4
set $alt Mod1
set $ipc noctalia msg

font pango:JetBrainsMono Nerd Font 10

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"

floating_modifier $mod normal
workspace_layout default

gaps inner 4
gaps outer 2
smart_gaps off
hide_edge_borders none

default_border pixel 4
default_floating_border pixel 4
