bindsym $mod+Return exec ghostty --gtk-single-instance=false
bindsym $mod+b exec firefox --new-window about:blank
bindsym $mod+f exec dolphin
bindsym $mod+q kill

bindsym $mod+space exec $ipc panel-toggle launcher
bindsym $mod+e exec $ipc panel-toggle launcher
bindsym $mod+v exec $ipc panel-toggle clipboard
bindsym $mod+o exec $ipc panel-toggle control-center
bindsym $mod+comma exec $ipc settings-toggle
bindsym $mod+period exec $ipc panel-toggle launcher "/emo"
bindsym $alt+Tab exec $ipc window-switcher hold

bindsym --locked XF86AudioRaiseVolume exec $ipc volume-up
bindsym --locked XF86AudioLowerVolume exec $ipc volume-down
bindsym --locked XF86AudioMute exec $ipc volume-mute
bindsym --locked XF86AudioMicMute exec $ipc mic-mute

bindsym --locked XF86MonBrightnessUp exec $ipc brightness-up
bindsym --locked XF86MonBrightnessDown exec $ipc brightness-down

bindsym Print exec $ipc screenshot-region
bindsym Shift+Print exec $ipc screenshot-fullscreen
bindsym $mod+Print exec $ipc screenshot-region

bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+i focus up
bindsym $mod+semicolon focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+a focus parent
bindsym $mod+Shift+a focus child

bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+semicolon move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+h splith
bindsym $mod+backslash splitv

bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+t layout toggle split

bindsym $mod+Shift+space floating toggle

bindsym $mod+l exec $ipc session lock
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r exec swaymsg reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit sway?' -B 'Yes, exit sway' 'swaymsg exit'
